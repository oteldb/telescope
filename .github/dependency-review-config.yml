fail_on_severity: "low"
allow_licenses:
  - "MIT"
  - "MIT-0"
  - "ISC"
  - "MPL-2.0"
  - "BSD-2-Clause"
  - "BSD-3-Clause"
  - "Apache-2.0"
  - "LicenseRef-scancode-google-patent-license-golang"

# The MCP SDK is Apache-2.0, and carries the protocol's own schema and
# documentation, which the specification publishes under CC-BY-4.0. The
# detector reports the three licenses of the repository as one expression, so
# the package is named here rather than the license being allowed everywhere:
# what is accepted is this dependency, not a class of them.
allow_dependencies_licenses:
  - "pkg:golang/github.com/modelcontextprotocol/go-sdk"
